# 开发环境 — 只启动基础设施，后端在本地跑
services:
  redis:
    image: redis:7-alpine
    container_name: nts-redis-dev
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: nts-minio-dev
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
